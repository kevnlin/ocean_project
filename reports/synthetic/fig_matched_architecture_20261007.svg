<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">OI-anchored multimodal ocean reconstruction: implemented candidate architecture</title>
<desc id="figure-desc">Per-depth Argo measurements and optional synthetic surface fields are encoded into a shared latent Transformer. An independent coordinate query decoder predicts residual and marginal Gaussian scale. In parallel, frozen spherical optimal interpolation and exact-depth local innovations provide numerical evidence for an anchored temperature and salinity prediction. The local Transformer variant updates each query representation only from its own neighborhood.</desc>
